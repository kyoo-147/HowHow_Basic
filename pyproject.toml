[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "howhow-basic"
version = "0.1.0"
description = "Filesystem-first evidence-oriented research CLI"
requires-python = ">=3.10"

[project.scripts]
howhow = "howhow.__main__:main"

[tool.setuptools.packages.find]
include = ["howhow*"]
